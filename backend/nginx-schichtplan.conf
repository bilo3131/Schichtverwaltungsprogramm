# Nginx Configuration für Schichtplan
# Speichere diese Datei als: /etc/nginx/sites-available/schichtplan
# Erstelle Symlink: sudo ln -s /etc/nginx/sites-available/schichtplan /etc/nginx/sites-enabled/

# Upstream für Gunicorn
upstream schichtplan_backend {
    server unix:/var/www/schichtplan/backend/gunicorn.sock fail_timeout=0;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name schichtplan.bilal-alac.de;

    # Let's Encrypt Challenge Location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect alles andere auf HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name schichtplan.bilal-alac.de;

    # SSL Zertifikate (werden von Let's Encrypt/Certbot automatisch eingetragen)
    ssl_certificate /etc/letsencrypt/live/schichtplan.bilal-alac.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schichtplan.bilal-alac.de/privkey.pem;
    
    # SSL Configuration (empfohlene Sicherheitseinstellungen)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max Upload Size (für Datei-Uploads)
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/schichtplan-access.log;
    error_log /var/log/nginx/schichtplan-error.log;

    # Root für Frontend (Angular Build)
    root /var/www/schichtplan/frontend;
    index index.html;

    # Django Static Files
    location /static/ {
        alias /var/www/schichtplan/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django Media Files
    location /media/ {
        alias /var/www/schichtplan/backend/mediafiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django API (Backend)
    location /api/ {
        proxy_pass http://schichtplan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # WebSocket Support (falls benötigt)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://schichtplan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular Frontend (SPA - alle Routen auf index.html)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Cache für statische Assets (JS, CSS, Bilder)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Robots.txt (optional)
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
