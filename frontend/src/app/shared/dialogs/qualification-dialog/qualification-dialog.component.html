<h2 mat-dialog-title>{{ data.qualification ? 'Qualifikation bearbeiten' : 'Neue Qualifikation' }}</h2>
<mat-dialog-content>
  <form [formGroup]="qualificationForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Abteilung</mat-label>
      <mat-select formControlName="department">
        <mat-option [value]="null">Keine Abteilung</mat-option>
        <mat-option *ngFor="let dept of departments" [value]="dept.id">
          {{ dept.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="z.B. Kassierer" required>
      <mat-error *ngIf="qualificationForm.get('name')?.hasError('required')">
        Name ist erforderlich
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Beschreibung</mat-label>
      <textarea matInput formControlName="description" rows="4" placeholder="Optionale Beschreibung der Qualifikation"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Abbrechen</button>
  <button mat-raised-button color="primary" 
          [disabled]="qualificationForm.invalid"
          (click)="onSave()">
    Speichern
  </button>
</mat-dialog-actions>
